# Speech Dispatcher generic output module that talks to omalexia-speakd.
#
# With this as the DefaultModule, every program that speaks through Speech
# Dispatcher — Firefox Reader View "Narrate", the Orca screen reader,
# `spd-say`, Chromium's Web Speech API — uses the same warm, local Piper
# voice as the F10 read-aloud key. Cancelling in the client kills the
# command below, which makes omalexia-say hang up and stops playback.
#
# Installed to ~/.config/speech-dispatcher/modules/omalexia.conf by
# omalexia/install.sh.

Debug 0

GenericExecuteSynth \
"printf %s \'$DATA\' | omalexia-say --wait --quiet --lang \'$LANGUAGE\' --rate \'$RATE\' -"

GenericCmdDependency "omalexia-say"
GenericDefaultCharset "utf-8"

# Speech Dispatcher rates run -100..100; omalexia-say maps them to a speed.
GenericRateAdd 0
GenericRateMultiply 1
GenericRateForceInteger 1

GenericPunctNone ""
GenericPunctSome ""
GenericPunctMost ""
GenericPunctAll ""

AddVoice "en" "FEMALE1" "en"
AddVoice "en" "MALE1"   "en"
AddVoice "nl" "FEMALE1" "nl"
AddVoice "nl" "MALE1"   "nl"

DefaultVoice "en"
